<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Child - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Smart Child</h1>
      <p class="text-gray-500 mt-2">Login to your account</p>
    </div>

    <div id="errorMsg" class="hidden mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg"></div>

    <form id="loginForm">
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-2">Email</label>
        <input type="email" id="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-semibold mb-2">Password</label>
        <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
        Login
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="reset.html" class="text-sm text-blue-600 hover:underline">Forgot password?</a>
      <p class="mt-4 text-sm text-gray-600">
        Don't have an account? <a href="register.html" class="text-blue-600 hover:underline">Register</a>
      </p>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8000/api';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMsg');

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',          // IMPORTANT: sends/receives cookies
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          // Login successful → redirect to dashboard
          window.location.href = 'dashboard.html';
        } else {
          errorDiv.classList.remove('hidden');
          errorDiv.innerText = data.error || 'Login failed';
        }
      } catch (err) {
        errorDiv.classList.remove('hidden');
        errorDiv.innerText = 'Network error. Please try again.';
      }
    });
  </script>
</body>
</html>
