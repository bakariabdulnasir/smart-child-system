<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Child - Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
    <h1 class="text-3xl font-bold text-center mb-6">Create Account</h1>
    <div id="errorMsg" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-lg"></div>
    <div id="successMsg" class="hidden mb-4 p-3 bg-green-100 text-green-700 rounded-lg"></div>

    <form id="registerForm">
      <div class="mb-4">
        <label class="block text-sm font-semibold">Full Name</label>
        <input type="text" id="fullName" class="w-full px-4 py-2 border rounded-lg" required>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-semibold">Email</label>
        <input type="email" id="email" class="w-full px-4 py-2 border rounded-lg" required>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-semibold">Password</label>
        <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg" required>
        <p class="text-xs text-gray-500 mt-1">Min. 6 chars, 1 uppercase, 1 number</p>
      </div>
      <div class="mb-6">
        <label class="block text-sm font-semibold">Confirm Password</label>
        <input type="password" id="confirmPassword" class="w-full px-4 py-2 border rounded-lg" required>
      </div>
      <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg">Register</button>
    </form>
    <p class="mt-4 text-center text-sm">Already have an account? <a href="login.html" class="text-blue-600">Login</a></p>
  </div>

  <script>
    const API_BASE = 'http://localhost:8000/api';

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const full_name = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirm_password = document.getElementById('confirmPassword').value;
      const errorDiv = document.getElementById('errorMsg');
      const successDiv = document.getElementById('successMsg');

      errorDiv.classList.add('hidden');
      successDiv.classList.add('hidden');

      try {
        const res = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ full_name, email, password, confirm_password })
        });

        const data = await res.json();

        if (res.ok) {
          successDiv.classList.remove('hidden');
          successDiv.innerText = 'Registration successful! Redirecting to login...';
          setTimeout(() => window.location.href = 'login.html', 2000);
        } else {
          errorDiv.classList.remove('hidden');
          errorDiv.innerText = data.error || data.errors ? Object.values(data.errors).join(', ') : 'Registration failed';
        }
      } catch (err) {
        errorDiv.classList.remove('hidden');
        errorDiv.innerText = 'Network error';
      }
    });
  </script>
</body>
</html>
