<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password - Smart Child</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
    <div id="requestForm">
      <h1 class="text-2xl font-bold text-center mb-6">Reset Password</h1>
      <div id="reqError" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-lg"></div>
      <div id="reqMessage" class="hidden mb-4 p-3 bg-green-100 text-green-700 rounded-lg"></div>
      <form id="requestResetForm">
        <div class="mb-6">
          <label class="block text-sm font-semibold mb-2">Email address</label>
          <input type="email" id="resetEmail" class="w-full px-4 py-2 border rounded-lg" required>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg">Send Reset Link</button>
      </form>
      <p class="mt-4 text-center"><a href="login.html" class="text-blue-600">Back to Login</a></p>
    </div>

    <div id="resetForm" class="hidden">
      <h1 class="text-2xl font-bold text-center mb-6">Create New Password</h1>
      <div id="resetError" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-lg"></div>
      <form id="confirmResetForm">
        <div class="mb-4">
          <label class="block text-sm font-semibold">New Password</label>
          <input type="password" id="newPassword" class="w-full px-4 py-2 border rounded-lg" required>
        </div>
        <div class="mb-6">
          <label class="block text-sm font-semibold">Confirm Password</label>
          <input type="password" id="confirmNewPassword" class="w-full px-4 py-2 border rounded-lg" required>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg">Reset Password</button>
      </form>
      <p class="mt-4 text-center"><a href="login.html" class="text-blue-600">Back to Login</a></p>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8000/api';

    // Check if URL contains a token parameter
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (token) {
      // Show the "set new password" form
      document.getElementById('requestForm').classList.add('hidden');
      document.getElementById('resetForm').classList.remove('hidden');

      document.getElementById('confirmResetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const new_password = document.getElementById('newPassword').value;
        const confirm_password = document.getElementById('confirmNewPassword').value;
        const errorDiv = document.getElementById('resetError');

        errorDiv.classList.add('hidden');

        if (new_password !== confirm_password) {
          errorDiv.classList.remove('hidden');
          errorDiv.innerText = 'Passwords do not match';
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/auth/password-reset/confirm`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Reset-Token': token
            },
            body: JSON.stringify({ new_password, confirm_password })
          });

          const data = await res.json();
          if (res.ok) {
            alert('Password reset successful! Please login.');
            window.location.href = 'login.html';
          } else {
            errorDiv.classList.remove('hidden');
            errorDiv.innerText = data.error || 'Reset failed';
          }
        } catch (err) {
          errorDiv.classList.remove('hidden');
          errorDiv.innerText = 'Network error';
        }
      });
    } else {
      // Show the "request reset" form
      document.getElementById('requestResetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('resetEmail').value;
        const errorDiv = document.getElementById('reqError');
        const messageDiv = document.getElementById('reqMessage');

        errorDiv.classList.add('hidden');
        messageDiv.classList.add('hidden');

        try {
          const res = await fetch(`${API_BASE}/auth/password-reset/request`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });

          const data = await res.json();
          if (res.ok) {
            messageDiv.classList.remove('hidden');
            messageDiv.innerText = data.message;
          } else {
            errorDiv.classList.remove('hidden');
            errorDiv.innerText = data.error || 'Request failed';
          }
        } catch (err) {
          errorDiv.classList.remove('hidden');
          errorDiv.innerText = 'Network error';
        }
      });
    }
  </script>
</body>
</html>
